<!DOCTYPE html>
<html lang="es" class="locked">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#000;
    --cream:#fff3c8;
    --gold:#ffd23f;
    --font:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); background:#000; -webkit-text-size-adjust:100%; }
  html.locked{ overflow:hidden; }
  html.locked, html.locked body{ overscroll-behavior:none; touch-action:none; }
  *,*::before,*::after{ box-sizing:inherit; }
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:var(--font); -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none; touch-action:manipulation;
  }

  
  .text{
    font-style:italic; font-weight:600; text-align:center; line-height:1.4;
    color:var(--cream); text-shadow:0 2px 14px rgba(0,0,0,.85), 0 0 24px rgba(255,190,40,.28);
  }
  .text .line{ margin:.12em 0; text-wrap:balance; }
  .text .line:last-child{ margin-top:.85em; color:var(--gold); font-size:1.12em; }
  .text .word{ display:inline-block; white-space:nowrap; }
  .text .ch{ display:inline-block; }


  #intro{
    position:fixed; inset:0; z-index:50; background:#000; overflow:hidden;
    cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    transition:opacity 1s ease; outline:none;
  }
  #intro.gone{ opacity:0; pointer-events:none; }

  .stage{
    --tx:0; --ty:0; --s:1;
    position:absolute; left:50%; top:50%;
    width:min(94vw, calc(84vh * .9311), 640px);
    width:min(94vw, calc(84svh * .9311), 640px);
    aspect-ratio:405 / 435;
    transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(var(--s));
    transition:transform 1.8s cubic-bezier(.65,0,.25,1), opacity 1.6s ease;
  }
  .stage.side{ --ty:-28vh; --s:.58; }
  .stage.sink{
    --ty:70vh; --s:.7; opacity:0;
    transition:transform 2.4s cubic-bezier(.6,0,.9,.6), opacity 1.6s ease .5s;
  }

  .leaves{
    position:absolute; inset:0; width:100%; height:100%;
    opacity:0; transform:scale(.5);
  }
  .fw{ position:absolute; aspect-ratio:1; opacity:0; transform:scale(0) rotate(-70deg); }
  .fw canvas{
    display:block; width:100%; height:auto;
    animation:sway 6s ease-in-out infinite alternate;
    animation-delay:calc(var(--d) * -4);
    transition:filter .4s ease;
    will-change:transform; backface-visibility:hidden;
  }
  @media (hover:hover){ .fw canvas:hover{ filter:brightness(1.13) saturate(1.1); } }
  .stage.bloom .leaves{ animation:leafIn 1.3s cubic-bezier(.2,.9,.3,1.1) forwards; }
  .stage.bloom .fw{ animation:bloom 1.6s cubic-bezier(.2,1.25,.35,1) var(--d) forwards; }

  @keyframes bloom{
    0%{ transform:scale(0) rotate(-70deg); opacity:0; }
    35%{ opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes leafIn{ to{ opacity:1; transform:scale(1); } }
  @keyframes sway{
    from{ transform:rotate(calc(var(--dir) * -5deg)); }
    to{ transform:rotate(calc(var(--dir) * 5deg)); }
  }

  .hint{
    position:absolute; left:0; right:0; text-align:center; pointer-events:none;
    font-style:italic; font-weight:500; letter-spacing:.05em;
    font-size:clamp(1.1rem, 3.6vw, 1.4rem); color:rgba(255,240,190,.82);
    transition:opacity .9s ease;
  }
  .hint.hide{ opacity:0; }
  #hint0{ top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:30px; }
  .seed{
    position:relative;
    width:14px; height:14px; border-radius:50%; background:var(--gold);
  }
  .seed::after{
    content:''; position:absolute; inset:-3px; border-radius:50%;
    border:2px solid rgba(255,210,63,.6);
    animation:ripple 2.2s ease-out infinite;
  }
  @keyframes ripple{
    0%{ transform:scale(1); opacity:.75; }
    100%{ transform:scale(5.5); opacity:0; }
  }
  #hint1{ bottom:calc(7vh + env(safe-area-inset-bottom,0px)); opacity:0; }
  #hint1.show{ opacity:1; }
  #hint1 span{ display:inline-block; animation:breathe 2.4s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:.45; } 50%{ opacity:1; } }

  .msg{
    position:absolute; left:50%; top:61%; transform:translate(-50%,-50%);
    width:min(88vw, 760px); font-size:clamp(1.1rem, 4.7vw, 1.9rem);
    pointer-events:none;
  }
  .msg .ch{
    opacity:0; transform:translateY(10px); filter:blur(5px);
    transition:opacity .6s ease, transform .6s ease, filter .6s ease;
  }
  .msg .ch.on{ opacity:1; transform:none; filter:none; }
  .msg.fall .ch{ animation:fall var(--dur) cubic-bezier(.5,0,1,.55) var(--d) forwards; }
  @keyframes fall{
    0%{ transform:translate(0,0) rotate(0deg); animation-timing-function:ease-out; }
    12%{ transform:translate(0,-10px) rotate(calc(var(--rot) * -.1)); animation-timing-function:cubic-bezier(.5,0,1,.55); }
    100%{ transform:translate(var(--dx),120vh) rotate(var(--rot)); }
  }

  #fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:55; }

  @media (min-aspect-ratio: 11/10){
    .stage.side{ --tx:-25vw; --ty:0; --s:.8; }
    .msg{ left:auto; right:3vw; top:50%; width:46vw; transform:translateY(-50%); font-size:clamp(1.2rem, 2.4vw, 2.2rem); }
  }

 
  .scene{
    position:relative; height:100vh; height:100svh;
    display:grid; place-items:center; overflow:hidden; padding:0 6vw;
  }
  .bq-inner{ will-change:transform, opacity; display:grid; place-items:center; }
  
  .cale{
    position:relative;
    width:min(92vw, calc(84vh * .7227), 540px);
    width:min(92vw, calc(84svh * .7227), 540px);
    aspect-ratio:529 / 732;
    animation:float 3.6s ease-in-out infinite alternate;
    user-select:none; -webkit-user-select:none;
  }
  .capa{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; object-fit:contain; -webkit-user-drag:none;
  }
  .cabeza img{ position:absolute; inset:0; width:100%; height:100%; -webkit-user-drag:none; }
  @keyframes float{ from{ transform:translateY(0); } to{ transform:translateY(-7px); } }

 
  .ramo{ transform-origin:28.7% 60.8%; animation:swing 4s ease-in-out infinite alternate; }
  @keyframes swing{ from{ transform:rotate(-1.8deg); } to{ transform:rotate(1.8deg); } }

  
  .cabeza{ transform-origin:53.3% 44.1%; animation:tilt 5s ease-in-out infinite alternate; }
  @keyframes tilt{ from{ transform:rotate(-1.6deg); } to{ transform:rotate(1.6deg); } }

  
  .parpado{
    position:absolute; top:26.8%; width:4.6%; height:3%;
    background:#f2e6db; border-radius:12% 12% 46% 46% / 8% 8% 70% 70%;
    transform:scaleY(0); transform-origin:top center;
    animation:blink 4.6s infinite;
  }
  .ojo-izq{ left:44.2%; }
  .ojo-der{ left:56.9%; }
  @keyframes blink{
    0%,94%,100%{ transform:scaleY(0); }
    96.5%,97.8%{ transform:scaleY(1); }
  }

 
  #restart{
    position:fixed; z-index:60;
    right:calc(18px + env(safe-area-inset-right,0px));
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    font-family:var(--font); font-style:italic; font-size:1.05rem; letter-spacing:.02em;
    color:var(--cream); background:rgba(20,16,4,.62); border:1px solid rgba(255,210,63,.45);
    border-radius:999px; padding:.55em 1.25em; cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity .8s ease, background .25s ease, border-color .25s ease;
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    min-height:44px; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  #restart.show{ opacity:.78; pointer-events:auto; }
  #restart:hover, #restart:focus-visible{ opacity:1; background:rgba(40,30,6,.8); border-color:var(--gold); }
  #restart:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  #phInner{ will-change:transform, opacity; opacity:0; }
  #phrase{ font-size:clamp(1.3rem, 5.1vw, 2.7rem); max-width:min(90vw, 860px); }
  #phrase .ch{ opacity:0; }
  .phrase.land #phrase .ch{ animation:land 1.3s cubic-bezier(.45,0,.35,1.25) var(--d) both; }
  @keyframes land{
    0%{ opacity:0; transform:translate(var(--dx),-100vh) rotate(var(--rot)); }
    10%{ opacity:1; }
    100%{ opacity:1; transform:translate(0,0) rotate(0deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .fw canvas, .chico, .ramo, .cabeza, .parpado, .seed, #hint1 span{ animation:none; }
    .parpado{ display:none; }
  }
</style>
</head>

<script>
(function(){
'use strict';

const MENSAJE = [
  'mi niña cuanto te amo,',
  'hoy te traigo estas flores con ilusión y alegría.',
  'Eres el sol que ilumina mis días',
  'y la razón por la que mi mundo florece.',
  'Contigo, hasta lo más simple se vuelve mágico.',
  'Gracias por existir, por tu risa',
  'y por elegirme cada día.',
  'Te amo hoy, mañana y siempre.',
  'Princesita mía.'
];

const MENSAJE_FINAL = [
  'Un pequeño gesto,',
  'solo espero que te guste,',
  'te las doy no porque sea este dia,',
  'sino porque te las mereces mi coosita linda.'
];

const $ = s => document.querySelector(s);
const root = document.documentElement;


const MOBILE = Math.min(innerWidth, innerHeight) < 700 ||
               /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const SOFT = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FLOWER_PX = MOBILE ? 420 : 700;   
const PART_MAX = MOBILE ? 90 : 220;     

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.scrollTo(0, 0);

function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function jag(ctx, R, cx, cy, r, amp, n){
  ctx.beginPath();
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2;
    const rr = r * (1 + (R() - .5) * amp * (i % 2 ? 1.6 : .6));
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

function petal(ctx, R, ang, r0, r1, hw, hue, light){
  ctx.save();
  ctx.rotate(ang);
  const n = 14, L = r1 - r0, top = [], bot = [];
  for (let i = 0; i <= n; i++){
    const t = i / n, x = r0 + L * t;
    const prof = Math.sin(Math.PI * Math.pow(t, .62)) * (1 - .25 * t);
    const w = hw * prof;
    const s1 = (i % 2 ? .30 : .05) * hw * R();
    const s2 = (i % 2 ? .05 : .30) * hw * R();
    top.push([x + (R() - .5) * L * .03, -(w + s1)]);
    bot.push([x + (R() - .5) * L * .03,  (w + s2)]);
  }
  ctx.beginPath();
  ctx.moveTo(r0, 0);
  top.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.lineTo(r1 + L * .04 * (R() - .3), (R() - .5) * hw * .3);
  for (let i = n; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
  ctx.closePath();
  const g = ctx.createLinearGradient(r0, 0, r1, 0);
  g.addColorStop(0,   'hsl(' + (hue - 6) + ',88%,' + (light * .72) + '%)');
  g.addColorStop(.45, 'hsl(' + hue + ',95%,' + light + '%)');
  g.addColorStop(1,   'hsl(' + (hue + 3) + ',100%,' + Math.min(80, light + 12) + '%)');
  ctx.fillStyle = g;
  ctx.fill();

  ctx.lineCap = 'round';
  for (let k = 0; k < 5; k++){
    const off = (R() - .5) * hw * 1.2;
    const x0 = r0 + L * (.1 + R() * .25), x1 = r0 + L * (.55 + R() * .4);
    const dark = R() < .5;
    ctx.strokeStyle = 'hsla(' + (hue + (dark ? -8 : 6)) + ',100%,' + (dark ? light - 14 : light + 14) + '%,' + (.35 + R() * .3) + ')';
    ctx.lineWidth = 1 + R() * 2.2;
    ctx.beginPath();
    ctx.moveTo(x0, off * .6);
    ctx.lineTo(x1, off * .25 + (R() - .5) * 3);
    ctx.stroke();
  }
  ctx.restore();
}

function sunflower(seed, size){
  size = size || FLOWER_PX;
  const R = mulberry(seed);
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const maxR = size / 2 * .97, d = maxR * .37;
  ctx.translate(size / 2, size / 2);

  const rings = [
    { n: 15, r1: .99, hw: .165, hue: 43, l: 45, off: 0 },
    { n: 15, r1: .89, hw: .160, hue: 46, l: 55, off: .5 },
    { n: 12, r1: .75, hw: .150, hue: 49, l: 64, off: .25 }
  ];
  rings.forEach(rg => {
    for (let i = 0; i < rg.n; i++){
      const ang = (i + rg.off) / rg.n * Math.PI * 2 + (R() - .5) * .2;
      petal(ctx, R, ang, d * .75, maxR * (rg.r1 + (R() - .5) * .09), maxR * rg.hw,
            rg.hue + (R() - .5) * 6, rg.l + (R() - .5) * 9);
    }
  });

  const disc = (r, amp, n, fill) => { jag(ctx, R, 0, 0, r, amp, n); ctx.fillStyle = fill; ctx.fill(); };
  disc(d * 1.13, .17, 60, '#a0701d');
  disc(d * .99,  .14, 54, '#764c14');
  disc(d * .76,  .12, 46, '#57370c');

  ctx.lineCap = 'round';
  for (let i = 0; i < 80; i++){
    const a = R() * Math.PI * 2, r0 = d * (.9 + R() * .12), r1 = r0 + d * (.1 + R() * .2);
    ctx.strokeStyle = R() < .5 ? 'rgba(96,62,16,.85)' : 'rgba(160,110,30,.8)';
    ctx.lineWidth = 1.2 + R() * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
    ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.stroke();
  }
  const cols = ['rgba(35,20,4,.55)', 'rgba(170,122,36,.5)', 'rgba(110,72,18,.55)'];
  for (let i = 0; i < 110; i++){
    const a = R() * Math.PI * 2, r = d * .95 * Math.sqrt(R());
    ctx.save();
    ctx.translate(Math.cos(a) * r, Math.sin(a) * r);
    ctx.rotate(R() * 3);
    ctx.fillStyle = cols[(R() * 3) | 0];
    ctx.fillRect(0, 0, 2 + R() * 4, 1.5 + R() * 2.5);
    ctx.restore();
  }
  disc(d * .36, .26, 26, '#3c3c14');
  disc(d * .17, .32, 16, '#5a5d20');
  return c;
}

function leaf(ctx, R, x, y, ang, len, hw, c1, c2){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  const n = 12, top = [], bot = [];
  for (let i = 0; i <= n; i++){
    const t = i / n, px = len * t;
    const w = hw * Math.sin(Math.PI * Math.pow(t, .8));
    top.push([px + (R() - .5) * len * .03, -(w + (i % 2 ? .25 : .02) * hw * R())]);
    bot.push([px + (R() - .5) * len * .03,  (w + (i % 2 ? .02 : .25) * hw * R())]);
  }
  ctx.beginPath();
  ctx.moveTo(0, 0);
  top.forEach(p => ctx.lineTo(p[0], p[1]));
  for (let i = n; i >= 0; i--) ctx.lineTo(bot[i][0], bot[i][1]);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, 0, len, 0);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(50,52,20,.6)';
  ctx.lineWidth = Math.max(2, hw * .08);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(len * .05, 0); ctx.lineTo(len * .86, 0); ctx.stroke();
  ctx.lineWidth = Math.max(1, hw * .04);
  for (let k = 1; k < 5; k++){
    const px = len * (.15 + k * .16);
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px + len * .1, -hw * .55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px + len * .1,  hw * .55); ctx.stroke();
  }
  ctx.restore();
}

const IMG_W = 405, IMG_H = 435;

function makeLeaves(){
  const W = MOBILE ? 560 : 900, H = Math.round(W * IMG_H / IMG_W), k = W / IMG_W;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const R = mulberry(7);
  const defs = [
    [150, 140, -140,  95, 26], [110, 260, 155,  92, 24], [170, 340, 150, 112, 28],
    [270, 220,   10, 118, 28], [290, 282,  42,  92, 24], [260, 350,  58,  88, 24],
    [125, 120, -100,  70, 20]
  ];
  defs.forEach((d, i) => {
    const light = i % 2;
    leaf(ctx, R, d[0] * k, d[1] * k, d[2] * Math.PI / 180, d[3] * k, d[4] * k,
         light ? '#565a22' : '#4d5022', light ? '#8b8c3f' : '#7d8034');
  });
  return c;
}

function place(el, cx, cy, diam){
  el.style.left  = ((cx - diam / 2) / IMG_W * 100) + '%';
  el.style.top   = ((cy - diam / 2) / IMG_H * 100) + '%';
  el.style.width = (diam / IMG_W * 100) + '%';
}

const stage = $('#stage');
const leaves = makeLeaves();
leaves.className = 'leaves';
stage.appendChild(leaves);
const FLOWERS = [

  [11, 180, 152, 170, .15,  1],
  [21, 277, 142, 205, .35, -1],
  [33, 117, 216, 195, .55,  1],
  [47, 207, 306, 235, .80, -1]
];
const slots = FLOWERS.map(f => {
  const w = document.createElement('div');
  w.className = 'fw';
  place(w, f[1], f[2], f[3]);
  w.style.setProperty('--d', f[4] + 's');
  w.style.setProperty('--dir', f[5]);
  stage.appendChild(w);
  return w;
});

(function drawNext(i){
  if (i >= FLOWERS.length) return;
  slots[i].appendChild(sunflower(FLOWERS[i][0]));
  requestAnimationFrame(() => drawNext(i + 1));
})(0);

function buildText(el, lines){
  const chars = [];
  lines.forEach(t => {
    const line = document.createElement('div');
    line.className = 'line';
    const words = t.split(' ');
    words.forEach((w, wi) => {
      const word = document.createElement('span');
      word.className = 'word';
      for (const ch of w){
        const s = document.createElement('span');
        s.className = 'ch';
        s.setAttribute('aria-hidden', 'true');
        s.textContent = ch;
        word.appendChild(s);
        chars.push(s);
      }
      line.appendChild(word);
      if (wi < words.length - 1) line.appendChild(document.createTextNode(' '));
    });
    if (chars.length) chars[chars.length - 1].dataset.end = '1';
    el.appendChild(line);
  });
  el.setAttribute('aria-label', lines.join(' '));
  return chars;
}

const msgEl = $('#msg');
const phrase = $('#phrase');
const msgChars = buildText(msgEl, MENSAJE);
const phChars  = buildText(phrase, MENSAJE_FINAL);

const fx = $('#fx'), fctx = fx.getContext('2d');
const parts = [];
let ambient = false, fxOn = true, running = false, fxW = 0, fxH = 0;

function sizeFx(){
  const dpr = Math.min(window.devicePixelRatio || 1, MOBILE ? 1.5 : 2);
  fxW = innerWidth; fxH = innerHeight;
  fx.width = Math.round(fxW * dpr);
  fx.height = Math.round(fxH * dpr);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeFx();

let rsTimer = null;
addEventListener('resize', () => {
  if (!fxOn) return;
  if (Math.abs(innerWidth - fxW) < 2 && Math.abs(innerHeight - fxH) < 120) return;
  clearTimeout(rsTimer);
  rsTimer = setTimeout(sizeFx, 180);
}, { passive: true });

function burst(x, y, n){
  if (SOFT) return;
  n = MOBILE ? Math.round(n * .6) : n;
  for (let i = 0; i < n && parts.length < PART_MAX; i++){
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 7;
    parts.push({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .25,
      len: 8 + Math.random() * 12, wid: 3 + Math.random() * 4,
      life: 0, max: 90 + Math.random() * 80,
      hue: 40 + Math.random() * 12, l: 52 + Math.random() * 20
    });
  }
  start();
}
function ambientPetal(){
  parts.push({
    x: Math.random() * fxW, y: -14,
    vx: (Math.random() - .5) * .5, vy: .7 + Math.random() * .9,
    rot: Math.random() * 6.28, vr: (Math.random() - .5) * .05,
    len: 7 + Math.random() * 8, wid: 2.5 + Math.random() * 3,
    life: 0, max: 99999, hue: 42 + Math.random() * 10, l: 55 + Math.random() * 18,
    amb: true, ph: Math.random() * 6
  });
}
function start(){
  if (running || !fxOn) return;
  running = true;
  requestAnimationFrame(loop);
}
function loop(){
  if (!fxOn){ running = false; return; }
  if (!parts.length && !ambient){   
    fctx.clearRect(0, 0, fxW, fxH);
    running = false;
    return;
  }
  fctx.clearRect(0, 0, fxW, fxH);
  const rate = MOBILE ? .04 : .07;
  if (ambient && parts.length < PART_MAX && Math.random() < rate) ambientPetal();
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life++;
    if (p.amb){
      p.x += p.vx + Math.sin(p.life * .03 + p.ph) * .6;
      p.y += p.vy;
    } else {
      p.vx *= .985; p.vy = p.vy * .985 + .09;
      p.x += p.vx + Math.sin(p.life * .06 + p.rot) * .4;
      p.y += p.vy;
    }
    p.rot += p.vr;
    const a = p.amb ? .85 : Math.min(1, (1 - p.life / p.max) * 2);
    if (a <= 0 || p.y > fxH + 30){ parts.splice(i, 1); continue; }
    fctx.save();
    fctx.translate(p.x, p.y);
    fctx.rotate(p.rot);
    fctx.fillStyle = 'hsla(' + p.hue + ',95%,' + p.l + '%,' + a + ')';
    fctx.beginPath();
    fctx.moveTo(0, -p.len);
    fctx.quadraticCurveTo(p.wid, -p.len * .2, 0, p.len);
    fctx.quadraticCurveTo(-p.wid, -p.len * .2, 0, -p.len);
    fctx.fill();
    fctx.restore();
  }
  requestAnimationFrame(loop);
}

addEventListener('visibilitychange', () => {
  if (document.hidden){ running = false; } else { start(); }
});

const intro = $('#intro'), hint0 = $('#hint0'), hint1 = $('#hint1');
let state = 0, typed = 0, typingTimer = null;

function advance(x, y){
  if (state === 0){
    state = .5;
    hint0.classList.add('hide');
    stage.classList.add('bloom');
    burst(x, y, 28);
    setTimeout(() => { state = 1; hint1.classList.add('show'); }, 1900);
  } else if (state === 1){
    state = 2;
    hint1.classList.remove('show');
    burst(x, y, 46);
    stage.classList.add('side');
    ambient = !SOFT;
    start();
    setTimeout(startTyping, 900);
  } else if (state === 2 && typed < msgChars.length){
    finishTyping();
  }
}
intro.addEventListener('click', e => advance(e.clientX, e.clientY));
intro.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    advance(innerWidth / 2, innerHeight / 2);
  }
});

function startTyping(){
  const tick = () => {
    if (typed >= msgChars.length){ typingDone(); return; }
    const c = msgChars[typed++];
    c.classList.add('on');
    const ch = c.textContent;
    let d = 42;
    if (',;'.indexOf(ch) > -1) d = 260;
    else if ('.!?'.indexOf(ch) > -1) d = 520;
    else if (c.dataset.end) d = 380;
    typingTimer = setTimeout(tick, d);
  };
  tick();
}
function finishTyping(){
  clearTimeout(typingTimer);
  msgChars.forEach(c => c.classList.add('on'));
  typed = msgChars.length;
  typingDone();
}
function typingDone(){
  if (state !== 2) return;
  state = 2.5;
  setTimeout(outro, 4300);   
}

function outro(){
  state = 3;
  ambient = false;
  msgChars.forEach(c => {
    c.style.setProperty('--dx',  (Math.random() * 80 - 40) + 'px');
    c.style.setProperty('--rot', (Math.random() * 160 - 80) + 'deg');
    c.style.setProperty('--d',   (Math.random() * 1.5) + 's');
    c.style.setProperty('--dur', (1.3 + Math.random() * .8) + 's');
  });
  msgEl.classList.add('fall');
  stage.classList.add('sink');
  setTimeout(revealFinal, 3700);
}

const bqInner = $('#bqInner'), phInner = $('#phInner'), phSection = $('#phraseSection');

let scrollQueued = false;
function onScroll(){
  const max = Math.max(1, root.scrollHeight - innerHeight);
  const p = Math.min(1, Math.max(0, scrollY / max));
  bqInner.style.opacity = (1 - p * .9).toFixed(3);
  bqInner.style.transform = 'translateY(' + (-p * 36).toFixed(1) + 'px) scale(' + (1 - p * .07).toFixed(3) + ')';
  const q = Math.min(1, Math.max(0, (p - .35) / .55));
  phInner.style.opacity = q.toFixed(3);
  phInner.style.transform = 'translateY(' + ((1 - q) * 34).toFixed(1) + 'px)';
}
function queueScroll(){
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => { scrollQueued = false; onScroll(); });
}
addEventListener('scroll', queueScroll, { passive: true });
addEventListener('resize', queueScroll, { passive: true });
addEventListener('orientationchange', () => setTimeout(onScroll, 250), { passive: true });
onScroll();

function scrollToY(y, ms, done){
  const y0 = window.scrollY, t0 = performance.now();
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  (function step(now){
    const t = Math.min(1, (now - t0) / ms);
    window.scrollTo(0, y0 + (y - y0) * ease(t));
    if (t < 1) requestAnimationFrame(step); else if (done) done();
  })(t0);
}

function revealFinal(){

  window.scrollTo(0, 1e6);
  onScroll();
  phChars.forEach(c => {
    c.style.setProperty('--dx',  (Math.random() * 120 - 60) + 'px');
    c.style.setProperty('--rot', (Math.random() * 180 - 90) + 'deg');
    c.style.setProperty('--d',   (Math.random() * 1.4) + 's');
  });

  intro.classList.add('gone');
  requestAnimationFrame(() => phSection.classList.add('land'));
  setTimeout(() => { intro.style.display = 'none'; }, 1100);
 
  setTimeout(() => {
    scrollToY(0, 2800, () => {
      root.classList.remove('locked');
      $('#restart').classList.add('show');
    });
  }, 4200);
}

$('#restart').addEventListener('click', () => {
  window.scrollTo(0, 0);
  location.reload();
});


const chico = $('#chico');
if (chico){
  chico.style.cursor = 'pointer';
  chico.addEventListener('click', e => {
    if (SOFT) return;
    fxOn = true;
    burst(e.clientX, e.clientY, 26);
  });
}
})();

</script>
